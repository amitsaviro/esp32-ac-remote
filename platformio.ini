; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32c6]
; The official PlatformIO platform doesn't support Arduino on the ESP32-C6,
; so we use pioarduino, the community fork that ships Arduino-ESP32 core 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; Wi-Fi + TLS + IR take ~1.2MB, close to the default 1.3MB app slot. This
; layout gives each of the two app slots 1.9MB (two slots keep over-the-air
; updates possible later) by shrinking the unused file system.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.9.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
; Route Serial to the UART pins, i.e. the USB-C port labeled CH343.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
